name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml')}}
          restore-keys: |
            ${{ runner.os }}-pip-
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: pip install -e ".[dev,live,suites]"
      - name: Check vectors are reproducible
        run: node spec/vectors/generate_jcs.mjs | python -c "import json,sys; a=json.load(sys.stdin); b=json.load(open('spec/vectors/jcs.json')); a.pop('generator'); b.pop('generator'); sys.exit(a != b)"
      - name: Run tests with coverage
        run: |
          openssl version
          coverage run -m pytest -rs
          coverage report --fail-under=80
