name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml')}}
          restore-keys: |
            ${{ runner.os }}-pip-
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install SoftHSM2 (PKCS#11 signing tests)
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: Install package
        run: |
          pip install -e ".[dev,ethereum,sm2,mcp,hsm,eudi]"
          pip install "sd-jwt @ git+https://github.com/openwallet-foundation-labs/sd-jwt-python.git@c5fda017d15e65a6c61a31e696bcdbdab2966b1e"  # test oracle
      - name: Lint
        run: python -m pyflakes upp tests spec/vectors/generate_protocol.py examples
      - name: Check vectors are reproducible
        run: scripts/check_vectors.sh
      - name: Run tests with coverage
        run: |
          openssl version
          coverage run -m pytest -rs
          coverage report --fail-under=80
